name: routine_fix
description: Daily Discipline & Task Tracker App (MVC + GetX)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  path_provider: ^2.1.4
  intl: ^0.19.0
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  uuid: ^4.4.2
  get_storage: ^2.1.1
  flutter_timezone: ^5.0.1
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21